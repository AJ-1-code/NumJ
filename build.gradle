plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.numj'
version = '1.0.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            groupId = 'com.numj'
            artifactId = 'NumJ'
            version = '1.0.0'
    }
}

    repositories {
        maven {
            name = 'local'
            url = layout.buildDirectory.dir('repositories')
        }
    }
}


tasks.register('runNumJTest', JavaExec) {
    group = 'verification'
    description = 'Runs the NumJ test suite.'

    dependsOn testClasses

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'numj.NumJTest'
}

tasks.register('runNumJBench', JavaExec) {
    group = 'verification'
    description = 'Runs the NumJ benchmark.'

    dependsOn testClasses

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'numj.NumJBench'
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--add-modules', 'jdk.incubator.vector']
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += ['--add-modules', 'jdk.incubator.vector']
}

test {
    jvmArgs += ["--add-modules", "jdk.incubator.vector"]
}